spring:
  application:
    name: playback-gate
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://localhost:3306/playback_gate?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: playback
    password: playback
    hikari:
      maximum-pool-size: 40
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cache:
    type: caffeine

  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: playback-gate
  prometheus:
    metrics:
      export:
        enabled: true

playback-gate:
  jwt:
    secret: playback-gate-local-secret-key-32bytes-min
    auth-token-validity-seconds: 86400
  load-test:
    member-count: 2000
